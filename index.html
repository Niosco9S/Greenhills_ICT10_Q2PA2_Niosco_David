<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>Club Candidates Adder</title>
</head>
<body>
    <center class="mt-4">
        <h1>Calpo's Club Candidates Adder (CCA)</h1>
        <div class="my-3">
            <input type="text" id="first_name" placeholder="First name">
            <input type="text" id="last_name" placeholder="Last name">
            <input type="button" py-click="add_member" value="Add Member">
        </div>
    </center>

    <div id="results" class="text-center mt-3"></div>

    <py-script src="main.py"></py-script>
</body>
</html>
